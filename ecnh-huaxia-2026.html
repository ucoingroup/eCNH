function renderNav(){

function cityCard(o,i){

}

 <section id="s-carrier"><h2>${L(n.carrier)}<span class="en">12 Cultural Carriers</span></h2><p class="intro">${L(I.carrierIntro)}</p>

  <div class="subst">${lang==='zh'?'Cherish your own beauty, appreciate others\u2019, share beauty together — the world as one. Within the four seas, all are brothers.':'Cherish your own beauty, appreciate others\u2019, share beauty together — the world as one. Within the four seas, all are brothers.'}</div>

  <p style="text-align:center;color:var(--sub);font-size:.75rem;margin-top:16px">华夏文化 × eCNH · ${lang==='zh'?'亚洲与地球村的共同发展':'Asia & Global Village Common Development'} · 2026–2030</p>`;
}
function copyCA(){
 const done=()=>{const b=document.querySelector('.ca-box button');if(b){b.textContent=L(I.copied);setTimeout(()=>b.textContent=L(I.copy),1500);}};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(CA).then(done).catch(()=>fallbackCopy(done));}
 else fallbackCopy(done);
}
function fallbackCopy(cb){const ta=document.createElement('textarea');ta.value=CA;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);cb();}
function applyTheme(){
 document.documentElement.setAttribute('data-theme',theme);
 localStorage.setItem('hx-theme',theme);
 document.querySelectorAll('.tdot').forEach(d=>d.classList.toggle('on',d.dataset.t===theme));
}
function setLang(l){
 lang=l;localStorage.setItem('hx-lang',l);
 $('langBtn').textContent=l==='zh'?'EN':'中文';
 document.documentElement.lang=l==='zh'?'zh-CN':'en';
 renderNav();renderMain();renderFooter();
}
document.querySelectorAll('.tdot').forEach(d=>d.onclick=()=>{theme=d.dataset.t;applyTheme();});
$('langBtn').onclick=()=>setLang(lang==='zh'?'en':'zh');
$('topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
applyTheme();
$('langBtn').textContent=lang==='zh'?'EN':'中文';
renderNav();renderMain();renderFooter();
</script>
