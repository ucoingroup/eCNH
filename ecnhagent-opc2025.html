{c:"B",q:["目标锚定什么资产？","What is the target peg?"],a:["路线建议：过渡期锚 USDC（流动性桥梁），目标期锚 CNH（储备支持）。","Suggested route: peg to USDC in transition (liquidity bridge), then to CNH (reserve-backed) as the goal."]},
{c:"B",q:["为什么当前价格波动大？","Why is the price so volatile?"],a:["池子深度不足、日成交额小，小额买卖即可造成大波动。","Shallow pools and tiny daily volume mean small trades move the price a lot."]},
{c:"B",q:["什么是深度、价差、滑点？","What are depth, spread and slippage?"],a:["深度是池内可用资金量；价差是买卖报价差；滑点是成交价与预期的偏离，三者共同决定交易成本。","Depth is the pool's available funds; spread is the bid-ask gap; slippage is deviation from the expected price — together they set trading cost."]},
{c:"B",q:["如何形成 1:1 锚定？","How can a 1:1 peg form?"],a:["需要真实储备 + 开放赎回 + 套利机制三者配合，仅靠宣传无法锚定。","Real reserves + open redemption + arbitrage must work together; publicity alone cannot peg a price."]},
{c:"B",q:["储备由谁托管？","Who would custody the reserves?"],a:["目标方案是持牌托管机构，由多签与法律协议约束，社区无权挪用。","The target is licensed custodians bound by multisig and legal agreements — the community cannot misappropriate them."]},
{c:"B",q:["什么是储备证明？","What is Proof of Reserves?"],a:["定期由独立审计方核对链上发行量与链下储备余额并公示，让「储备多少、发行多少」可验证。","Independent auditors regularly reconcile on-chain supply with off-chain reserves and publish it, making 'issue only what is reserved' verifiable."]},
{c:"B",q:["增发和销毁机制是什么？","What are the mint and burn rules?"],a:["目标规则：有储备流入才增发，赎回时销毁，杜绝凭空增发。","Target rule: mint only against reserve inflows; burn upon redemption — no minting out of thin air."]},
{c:"B",q:["与 USDC 什么关系？","What is the role of USDC?"],a:["USDC 是 Solana 上深度最好的合规稳定币，适合作为 eCNH 的主要报价与流动性资产。","USDC is the deepest compliant stablecoin on Solana — suited as eCNH's main quote and liquidity asset."]},
{c:"B",q:["套利如何维持锚定？","How does arbitrage maintain the peg?"],a:["当 eCNH 偏离锚定价，套利者可在池与赎回通道间搬砖，把价格拉回。","When eCNH deviates from the peg, arbitrageurs trade between the pool and redemption channel to pull the price back."]},
{c:"B",q:["主要价格风险有哪些？","What are the main price risks?"],a:["无锚定风险、流动性枯竭、集中持仓砸盘、监管变化、合约漏洞。","No-peg risk, liquidity drying up, concentrated holders dumping, regulatory change, contract bugs."]},
{c:"B",q:["eCNH 会归零吗？","Can eCNH go to zero?"],a:["任何小市值代币都存在归零可能，没有人能承诺相反。","Any small-cap token can go to zero — no one can promise otherwise."]},
{c:"B",q:["货币政策由谁决定？","Who decides monetary policy?"],a:["DAO 治理投票，且增发类提案需满足上限与时间锁。","DAO governance voting, with minting proposals subject to caps and timelocks."]},
/* C 技术与安全 25-36 */
{c:"C",q:["SPL Token 是什么？","What is SPL Token?"],a:["Solana 的代币标准，类似以太坊的 ERC-20。","Solana's token standard, analogous to ERC-20 on Ethereum."]},
{c:"C",q:["合约权限有哪些？","What contract authorities exist?"],a:["铸造权限、冻结权限等；权限状态应在社区看板公开。","Mint and freeze authorities, among others; their status should be public on the community dashboard."]},
{c:"C",q:["铸造权限应该怎么处理？","What should be done with mint authority?"],a:["长期应转移至多签 + 时间锁，或彻底放弃，杜绝单点作恶。","Long term: transfer to multisig + timelock or revoke entirely — eliminate single points of abuse."]},
{c:"C",q:["有冻结权限吗？","Is there a freeze authority?"],a:["以链上实际权限为准，社区文档应明确披露并说明用途。","On-chain reality is authoritative; community docs must disclose it and explain its purpose."]},
{c:"C",q:["如何验证合约信息？","How to verify contract info?"],a:["用 Solana 浏览器查看 CA、权限、持仓分布，与官方文档比对。","Use a Solana explorer to check CA, authorities and holder distribution against official docs."]},
{c:"C",q:["用什么钱包？","Which wallets?"],a:["Phantom、Solflare 等主流 Solana 钱包均可，务必从官方渠道下载。","Mainstream Solana wallets like Phantom or Solflare — download only from official channels."]},
{c:"C",q:["如何保管私钥？","How to keep keys safe?"],a:["助记词离线抄写、永不拍照上传、不告知任何人；大额考虑硬件钱包。","Write the seed phrase offline, never photograph or share it; use a hardware wallet for large holdings."]},
{c:"C",q:["如何防骗？","How to avoid scams?"],a:["只信官方公布的 CA 与链接，警惕假客服、假空投、假授权。","Trust only the official CA and links; beware fake support, fake airdrops, fake approvals."]},
{c:"C",q:["如何识别仿盘？","How to spot fake copies?"],a:["核对合约地址是唯一可靠方法，名称相同不代表是同一代币。","Verifying the contract address is the only reliable way — the same name is not the same token."]},
{c:"C",q:["有跨链计划吗？","Are there cross-chain plans?"],a:["属研究阶段议题，跨链会引入额外安全风险，需先做好单链基础。","A research-stage topic — bridging adds risk; strengthen the single-chain base first."]},
{c:"C",q:["会做合约审计吗？","Will there be an audit?"],a:["DAO 计划在扩募资金中优先安排第三方审计。","The DAO plans to prioritize a third-party audit as funds allow."]},
{c:"C",q:["有漏洞赏金计划吗？","Is there a bug bounty?"],a:["建议设立，鼓励白帽提交安全问题。","Recommended — encourage white hats to report vulnerabilities."]},
/* D 市场与流动性 37-48 */
{c:"D",q:["当前有哪些交易对？","Which pairs exist now?"],a:["eCNH/SOL（Meteora）、eCNH/USDC（Raydium）、SOL/eCNH（Orca）等，详见行情页。","eCNH/SOL (Meteora), eCNH/USDC (Raydium), SOL/eCNH (Orca) — see the chart page."]},
{c:"D",q:["为什么流动性分散？","Why is liquidity fragmented?"],a:["历史上开过多个池，资金被摊薄；整合是当前首要任务。","Multiple pools were opened historically, diluting funds; consolidation is the top priority."]},
{c:"D",q:["如何提升深度？","How to deepen liquidity?"],a:["集中到一两个主池、引入做市激励、预留套利资金。","Focus on one or two main pools, add market-making incentives, reserve arbitrage funds."]},
{c:"D",q:["做市激励怎么设计？","How to design LP incentives?"],a:["向主池 LP 提供社区金库激励，按锁仓时间与深度贡献分配。","Reward main-pool LPs from the community treasury, allocated by lock-up time and depth contribution."]},
{c:"D",q:["做 LP 有什么风险？","What are the LP risks?"],a:["无常损失、抵押资产价格波动、智能合约风险。","Impermanent loss, price volatility of paired assets, smart-contract risk."]},
{c:"D",q:["稳定池和普通池区别？","Stable vs. regular pools?"],a:["稳定池（如 eCNH/USDC）适合锚定资产对，价差小；普通池（如 eCNH/SOL）适合波动对。","Stable pools (eCNH/USDC) suit pegged pairs with small spreads; regular pools (eCNH/SOL) suit volatile pairs."]},
{c:"D",q:["可以上中心化交易所吗？","Can it list on CEXs?"],a:["需满足各所合规要求与流动性门槛，属于中期目标。","Requires each exchange's compliance and liquidity thresholds — a mid-term goal."]},
{c:"D",q:["有 OTC 吗？","Is there OTC?"],a:["未来可探索合规 OTC 通道，当前请勿参与场外私下交易。","Compliant OTC may be explored later; avoid private over-the-counter trades for now."]},
{c:"D",q:["交易手续费多少？","What are the fees?"],a:["取决于 DEX 池费率与网络费，Solana 网络费极低。","Depends on the DEX pool fee plus network fee; Solana network fees are extremely low."]},
{c:"D",q:["价格用什么预言机？","Which price oracle?"],a:["锚定机制建立前以池价为准；建立后需接入可靠价格源。","Pool price rules until a peg mechanism exists; then a reliable oracle is required."]},
{c:"D",q:["为什么日成交量小？","Why is daily volume small?"],a:["项目早期、应用场景未落地，这是客观现状，也是路线图要解决的问题。","It's an early-stage project without live use cases — the objective reality the roadmap addresses."]},
{c:"D",q:["有数据看板吗？","Is there a data dashboard?"],a:["DAO 计划建设公开看板：供应、持有人、集中度、池深度、成交量。","The DAO plans a public dashboard: supply, holders, concentration, pool depth, volume."]},
/* E DAO 治理 49-62 */
{c:"E",q:["什么是 DAO？","What is a DAO?"],a:["去中心化自治组织：规则写在链上，决策由社区投票，执行由多签完成。","A decentralized autonomous organization: rules on-chain, decisions by community vote, execution by multisig."]},
{c:"E",q:["eCNH DAO 的使命是什么？","What is the eCNH DAO mission?"],a:["以透明、合规、社区共建的方式，探索华人社区的开放金融与文化传播。","To explore open finance and cultural transmission for Chinese communities, transparently, compliantly and collaboratively."]},
{c:"E",q:["如何加入发展小组？","How to join the working groups?"],a:["按六大工作组（技术/流动性/合规/社区/研究/增长）认领任务，以贡献获得席位。","Claim tasks in one of six groups (tech/liquidity/compliance/community/research/growth); seats are earned by contribution."]},
{c:"E",q:["提案流程是什么？","What is the proposal process?"],a:["论坛讨论 7 天 → 温度检查 → 链上投票 → 多签 + 时间锁执行。","7-day forum discussion → temperature check → on-chain vote → multisig + timelock execution."]},
{c:"E",q:["投票权怎么算？","How is voting power counted?"],a:["持币量加权，并设单地址投票权上限防止巨鲸操控。","Token-weighted, with a per-address cap to prevent whale domination."]},
{c:"E",q:["什么是多签？","What is multisig?"],a:["多人共管的钱包，如 5/9 表示 9 人中至少 5 人签名才能动用。","A wallet co-managed by several people — e.g. 5-of-9 means at least five must sign to spend."]},
{c:"E",q:["时间锁有什么用？","What does a timelock do?"],a:["交易通过后延迟执行（如 48 小时），给社区反应窗口，防止突然作恶。","Delays execution after approval (e.g. 48 hours), giving the community a reaction window against sudden abuse."]},
{c:"E",q:["金库怎么管理？","How is the treasury managed?"],a:["预算提案制、季度报告、链上地址全公开。","Budget proposals, quarterly reports, fully public on-chain addresses."]},
{c:"E",q:["如何防止巨鲸操控？","How to prevent whale manipulation?"],a:["投票权上限、二次方投票、锁仓加权等工具组合（治理议题）。","Tools like voting caps, quadratic voting and lock-up weighting (governance topics)."]},
{c:"E",q:["贡献者如何退出？","How can contributors exit?"],a:["角色可自由退出，金库资产按既定规则交接，社区知识文档化留存。","Roles can be freely exited; treasury assets hand over by rule; community knowledge is documented."]},
{c:"E",q:["贡献者有什么激励？","What incentives exist for contributors?"],a:["社区金库的资助与声誉激励，明确不与拉新人数挂钩。","Treasury grants and reputation incentives — explicitly not tied to referral counts."]},
{c:"E",q:["会议节奏是什么？","What is the meeting rhythm?"],a:["建议：周会（工作组）+ 月度全体 + 季度路线复盘，全部公开纪要。","Suggested: weekly group meetings, monthly all-hands, quarterly roadmap reviews — minutes all public."]},
{c:"E",q:["透明度承诺有哪些？","What transparency commitments?"],a:["供应量、集中度、储备、赎回、权限状态定期披露。","Regular disclosure of supply, concentration, reserves, redemptions and authority status."]},
{c:"E",q:["与其他 DAO 如何协作？","How does it cooperate with other DAOs?"],a:["技术开源、标准互通、联合研究，不承诺任何财务互绑。","Open-source tech, interoperable standards, joint research — no financial entanglement."]},
/* F 合规与风险 63-78 */
{c:"F",q:["eCNH 合法吗？","Is eCNH legal?"],a:["因司法辖区而异，请咨询当地持牌律师；DAO 不向受限地区推广。","Varies by jurisdiction — consult a licensed local lawyer; the DAO does not promote to restricted regions."]},
{c:"F",q:["eCNH 是证券吗？","Is eCNH a security?"],a:["取决于各辖区 Howey 等测试与具体销售方式；DAO 不做收益承诺以降低风险。","Depends on tests like Howey and the sales method per jurisdiction; the DAO makes no return promises to reduce risk."]},
{c:"F",q:["发行 CNH 稳定币需要什么牌照？","What licences would a CNH stablecoin need?"],a:["视地区可能需要支付牌照、电子货币牌照或稳定币发行牌照（如香港 2025 条例、欧盟 MiCA EMT）。","Depending on region: payment, e-money or stablecoin-issuer licences (e.g. Hong Kong 2025 Ordinance, EU MiCA EMT)."]},
{c:"F",q:["反洗钱要求是什么？","What are the AML requirements?"],a:["法币出入金环节执行 KYC/AML，遵守 FATF「转移规则」与旅行规则。","KYC/AML on fiat on/off-ramps; follow FATF transfer rules and the travel rule."]},
{c:"F",q:["持有要交税吗？","Is holding taxable?"],a:["多数辖区对加密资产交易征税，请咨询当地税务顾问。","Most jurisdictions tax crypto transactions — consult a local tax adviser."]},
{c:"F",q:["中国大陆居民可以参与吗？","Can mainland China residents participate?"],a:["大陆严禁虚拟货币相关业务活动；DAO 不在大陆运营、推广或提供服务。","Mainland China strictly bans virtual-currency business activities; the DAO neither operates, promotes nor serves there."]},
{c:"F",q:["美国用户可以参与吗？","Can US users participate?"],a:["初期建议限制美国人士参与，直至合规路径明确。","US persons are suggested to be excluded initially, until a compliant path is clear."]},
{c:"F",q:["最大的投资风险是什么？","What is the biggest investment risk?"],a:["流动性风险与归零风险居首，其次是集中持仓与监管风险。","Liquidity and total-loss risk come first, then concentration and regulatory risk."]},
{c:"F",q:["集中度风险多大？","How large is the concentration risk?"],a:["社区分析显示前十大地址约 19%（请自行核验），治理与做市设计需对冲此风险。","Community analysis suggests top-10 addresses hold ~19% (verify yourself); governance and market-making must hedge this."]},
{c:"F",q:["智能合约风险是什么？","What is smart-contract risk?"],a:["漏洞被利用可能导致资产损失，审计只能降低而非消除风险。","Exploited bugs can cause asset loss; audits reduce but do not eliminate risk."]},
{c:"F",q:["监管变化风险是什么？","What is regulatory risk?"],a:["各辖区政策仍在演变，可能影响交易、持有与推广。","Policies are still evolving and may affect trading, holding and promotion."]},
{c:"F",q:["遇到问题如何反馈？","How to report issues?"],a:["通过官方治理论坛提案或工作组渠道，无任何「客服私聊」。","Via the official governance forum or working-group channels — there is no 'support DM'."]},
{c:"F",q:["官方会承诺收益吗？","Does the project promise returns?"],a:["永远不会。任何承诺收益、保本、拉盘的信息都是骗局。","Never. Any promise of returns, principal protection or pump plans is a scam."]},
{c:"F",q:["有拉人头奖励吗？","Are there referral rewards?"],a:["没有，也禁止此类推广方式。","No — and such promotion is prohibited."]},
{c:"F",q:["哪些社区行为被禁止？","Which community behaviors are banned?"],a:["喊单、承诺收益、传销式推广、假冒官方、虚假信息披露。","Shilling, return promises, pyramid promotion, impersonating officials, false disclosures."]},
{c:"F",q:["免责声明的核心是什么？","What is the core of the disclaimer?"],a:["DYOR（自己做研究）、自担风险、无追索对象。","DYOR, risk borne by yourself, no recourse."]},
/* G 生态与 OPC 79-90 */
{c:"G",q:["跨境汇款愿景是什么？","What is the remittance vision?"],a:["长期探索低成本华人跨境价值传输，前提是合规通道与深度达标。","Long-term exploration of low-cost cross-border value transfer — contingent on compliant rails and adequate depth."]},
{c:"G",q:["贸易结算愿景是什么？","What is the trade-settlement vision?"],a:["服务东南亚华人中小企业间的对账与结算实验（沙盒化推进）。","Serving reconciliation and settlement pilots for Chinese SMEs in Southeast Asia, sandbox-style."]},
{c:"G",q:["能做社区积分吗？","Can it be used as community points?"],a:["可以：社区贡献记录、荣誉体系与链上凭证。","Yes: contribution records, honor systems and on-chain certificates."]},
{c:"G",q:["能做 NFT 吗？","Can NFTs be issued?"],a:["文化主题数字藏品是低风险切入点，与 eCNH 联动但独立核算。","Cultural NFTs are a low-risk entry point — linked to eCNH but independently accounted."]},
{c:"G",q:["商户支付试点可行吗？","Are merchant-payment pilots feasible?"],a:["在监管友好辖区与愿意参与的华人商户做小额试点。","Small-value pilots with willing Chinese merchants in regulation-friendly jurisdictions."]},
{c:"G",q:["会做 GameFi/SocialFi 吗？","Will there be GameFi/SocialFi?"],a:["属可选生态方向，不做财务预期宣传。","Optional ecosystem directions — no financial expectations promoted."]},
{c:"G",q:["教育内容有哪些？","What educational content exists?"],a:["货币史、稳定币原理、链上安全、DAO 治理的系列科普。","Series on monetary history, stablecoin mechanics, on-chain security and DAO governance."]},
{c:"G",q:["如何做公益？","How is charity done?"],a:["透明捐赠实验：链上可追溯的小额公益支出。","Transparent donation experiments: traceable small-value charitable spending on-chain."]},
{c:"G",q:["什么是 eCNH Agent 与 OPC？","What are eCNH Agent and OPC?"],a:["Agent 是围绕生态的 AI 智能体助手（内容、问答、看板、自动化）；OPC（One Person Company）是一人公司，用 AI 高管团队补齐职能，一人即一支舰队。","Agent: AI assistants for content, Q&A, dashboards and automation; OPC (One Person Company): a solo company staffed by an AI executive team — one person, one fleet."]},
{c:"G",q:["10 个 eCNH OPC 节点是什么？","What are the 10 eCNH OPC nodes?"],a:["eCNH Agent Operation Company：分布新加坡、香港、迪拜、楚格、吉隆坡、曼谷、阿拉木图、东京、伦敦、旧金山的一人公司节点——统一品牌、本地合规、独立核算。","eCNH Agent Operation Companies: one-person nodes in Singapore, Hong Kong, Dubai, Zug, KL, Bangkok, Almaty, Tokyo, London and San Francisco — one brand, local compliance, independent books."]},
{c:"G",q:["OPC 如何做合规？","How does an OPC stay compliant?"],a:["当地依法注册、税务申报、KYC/AML、不碰非法资金、不向受限地区推广。","Register locally, file taxes, apply KYC/AML, touch no illicit funds, and never promote to restricted regions."]},
{c:"G",q:["有开发者资助吗？","Are there developer grants?"],a:["建议设立小额 Grant，资助工具、看板与教育项目。","Small grants are recommended for tools, dashboards and education projects."]},
/* H 星际文明与愿景 91-100 */
{c:"H",q:["「星际文明」指什么？","What does 'interstellar civilization' mean?"],a:["一种文化叙事：以千年尺度思考文明与价值存储，激励长期主义。","A cultural narrative: thinking about civilization and value storage at a millennium scale, inspiring long-termism."]},
{c:"H",q:["「仙女座」有何寓意？","What does Andromeda symbolize?"],a:["距银河系最近的大星系，象征「最远也可抵达」的探索精神。","The nearest major galaxy — symbolizing an exploratory spirit where even the farthest is reachable."]},
{c:"H",q:["星际时代需要货币吗？","Will the interstellar era need currency?"],a:["这是哲学问题：跨光年的信任与结算或需全新范式，社区以此激发讨论。","A philosophical question: trust and settlement across light-years may need a new paradigm — the community uses it to spark discussion."]},
{c:"H",q:["2050 愿景是什么？","What is the 2050 vision?"],a:["成为合规、透明、被广泛理解的华人社区开放金融基础设施。","To become compliant, transparent, widely understood open-finance infrastructure for Chinese communities."]},
{c:"H",q:["太空经济与数字资产有关吗？","Is the space economy related to digital assets?"],a:["卫星通信、轨道数据交易等正在兴起，加密技术可能参与其中。","Satellite communications and orbital data markets are rising; crypto may play a role."]},

function renderQAFilters(){
  const n=I.nav;
  $('qaFilter').innerHTML=`<span class="chip ${qaFilter==='ALL'?'on':''}" onclick="setQAFilter('ALL')">${lang==='zh'?'全部':'All'}</span>`+
    QA_CATS.map(c=>`<span class="chip ${qaFilter===c[0]?'on':''}" onclick="setQAFilter('${c[0]}')">${c[0]} · ${lang==='zh'?c[1]:c[2]}</span>`).join('');
}
function setQAFilter(f){qaFilter=f;renderQAFilters();renderQA();}
function renderQA(){
  const kw=($('qaSearch').value||'').toLowerCase();
  const list=QA.map((q,i)=>({q,i})).filter(({q})=>{
    if(qaFilter!=='ALL'&&q.c!==qaFilter)return false;
    if(!kw)return true;
    return (q.q[0]+q.q[1]+q.a[0]+q.a[1]).toLowerCase().includes(kw);
  });
  $('qaList').innerHTML=list.map(({q,i})=>`<details><summary><span class="qcat">${q.c}${String(i+1).padStart(3,'0')}</span>${lang==='zh'?q.q[0]:q.q[1]}</summary><div class="ans">${lang==='zh'?q.a[0]:q.a[1]}</div></details>`).join('')
    ||`<p style="color:var(--sub)">${lang==='zh'?'没有匹配的问答。':'No matching Q&A.'}</p>`;
}
function renderQuotes(){
  const kw=($('qSearch').value||'').toLowerCase();
  const list=QUOTES.map((q,i)=>({q,i})).filter(({q})=>!kw||(q[0]+q[1]).toLowerCase().includes(kw));
  $('qCount').textContent=`${I.total[lang]} ${list.length} / ${QUOTES.length} ${I.items[lang]}`;
  $('qList').innerHTML=list.map(({q,i})=>`<li>${i+1}. ${q[0]}<small>${q[1]}</small></li>`).join('');
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme',theme);
  localStorage.setItem('ecnh-theme',theme);
  document.querySelectorAll('.tdot').forEach(d=>d.classList.toggle('on',d.dataset.t===theme));
}
function setLang(l){
  lang=l;localStorage.setItem('ecnh-lang',l);
  $('langBtn').textContent=l==='zh'?'EN':'中文';
  renderAll();
}
function renderAll(){renderNav();renderMain();renderFooter();}
function copyCA(){
  const done=()=>{const b=document.querySelector('.ca-box button');if(b){b.textContent=L(I.copied);setTimeout(()=>b.textContent=L(I.copy),1500);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(CA).then(done).catch(()=>fallbackCopy(done));}
  else fallbackCopy(done);
}
function fallbackCopy(cb){const ta=document.createElement('textarea');ta.value=CA;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);cb();}
document.querySelectorAll('.tdot').forEach(d=>d.onclick=()=>{theme=d.dataset.t;applyTheme();});
$('langBtn').onclick=()=>setLang(lang==='zh'?'en':'zh');
$('topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
