path:{title:"Development Path: Eight Pillars",
 intro:"Trust before growth. First clarify asset positioning and transparency, then liquidity and community, and finally distributed governance — that is the order of eCNH DAO.",
 items:[["1","Asset positioning & transparency","Disclose whether a real peg exists (goal: CNH 1:1 reserves, issuer and redemption mechanism); disclose contract authorities (no mint, no freeze), holder distribution and multisig addresses. Without transparency there is no basis for trust."],
 ["2","Fix liquidity & pricing","Clean up or recalibrate price-deviated pools; concentrate depth into one or two main pairs (e.g. eCNH-USDC) with meaningful depth; use liquidity incentives to attract market makers, knowing subsidy-only liquidity rarely lasts."],
 ["3","Reduce holder concentration","Distribute tokens to real active users — not a few whales — via airdrops, quests and contribution rewards. With ~3,313 holders, first grow genuinely active addresses."],
 ["4","DAO governance structure","Set up a multisig treasury with public fund usage; run proposals and votes on-chain; adopt a hybrid “committee + community vote” model at first, delegating gradually; define voting power, proposal thresholds and budget quotas."],
 ["5","Real use cases","Cross-border payments, micro-remittances, offshore-CNH trade settlement, stablecoin exchange; integrate with DeFi (lending collateral, market making) so holders have reasons to use, not just hold."],
 ["6","Community & operations","Build bilingual (CN/EN) communities for Southeast Asia, Hong Kong & Macao (China) and overseas Chinese communities; run ambassador/contributor programs; publish on-chain data (holders, volume, liquidity) regularly to build credibility."],
 ["7","Compliance & risk","RMB-related assets involve FX and stablecoin regulation across jurisdictions — seek local legal opinions on issuance, redemption and promotion; avoid exaggerated claims, especially while trust is low and liquidity thin."],
 ["8","Periodic refinement","Fully revise the development plan every 2-3 years, rolling with technology, community and regulatory evolution."]]},

 items:[
["What is eCNH?","eCNH is the long-term distributed community experimental token of Andromeda and interstellar civilizations on Solana, aiming to become an experimental offshore-CNY settlement vehicle for the Global Village."],
["What is eCNH's contract address (CA)?","7GQnqthWKa5v2GqXYWhmgWZY5mCRrniwK3Xuinm9GKw5 — always rely on official announcements."],
["Which chain does eCNH run on?","Solana — fast and cheap, suited to high-frequency micro-settlement."],
["What do the multiple meanings of eCNH stand for?","earth / europe / east / energy CNH — Earth, Europe, East and Energy, four in one."],
["How do I buy eCNH?","Swap USDC for eCNH via DEXs like Jupiter or Orca inside a Solana wallet."],
["What wallet do I need?","A Solana wallet such as Phantom or Solflare; always back up your seed phrase."],
["What is Solana?","A high-performance blockchain with fast blocks and negligible fees — eCNH's settlement base."],
["Are transaction fees high?","On-chain fees are usually far below 0.01 SOL; main costs come from slippage and spread."],
["Where can I find official information?","Rely on the official site and announcements; market data on the Orb Markets token page."],
["What is the Meteora DAO POOL?","Ac2bwg4ByZr2FePpuKKdjGLpfRMenFsjgt17St9PfBKC — the eCNH distributed DAO pool (dAMM v2)."],
["What is the Orca pool?","A WBTC/eCNH pool providing cross-asset liquidity for long-term holders."],
["How does eCNH relate to offshore CNH?","The vision is a 1:1 peg with offshore Renminbi; that peg does not exist yet — everything depends on verifiable reserves."],
["Is eCNH a stablecoin now?","No. eCNH is a distributed community experimental token whose future goal is more than a stablecoin; its price currently fluctuates — do not treat it as a stablecoin."],
["How do I verify the contract?","Check CA, authorities and mint records on Solana Explorer, and cross-check official announcements."],
["What is a CA?","Contract Address — the token's unique on-chain identity; trusting the CA is key to avoiding fakes."],
["How do I avoid fake tokens and phishing?","Trust only the official CA and domains; beware of DM “support”; never sign unknown requests."],
["How are tokens distributed?","Via community airdrops, quest rewards and liquidity incentives, avoiding whale concentration."],
["Where can I see holder counts?","Solscan or Orb Markets show holder distribution and active addresses."],
["What is eCNH's long-term goal?","To become a micro-settlement tool for the AI economy and global Chinese communities, with DAO governance."],
["Where is the community?","Official eCNH DAO accounts on Telegram, X (Twitter) and more — beware impersonators."],
["What is eCNH DAO 2027?","A distributed community organization maturing by 2027, in charge of governance, treasury and charity."],
["How do I join the DAO?","Hold tokens, register for community quests, and join proposal discussions and votes."],
["How does the DAO make decisions?","On-chain proposals + community votes; a hybrid “committee + community vote” model at first."],
["What is a multisig treasury?","Funds managed by multiple independent signers — no single party can move them."],
["What is the proposal threshold?","A minimum holding or community-reputation requirement to prevent spam proposals."],
["How is voting power computed?","Initially holding-weighted with caps; contribution weighting will be added later."],
["What are distributed DAO groups?","Small self-organized teams by region or function (tech, charity, operations)."],
["How is an overseas group founded?","Initiated by 3-5 active members with public goals and budget, ratified by community vote."],
["Where does group funding come from?","From the DAO treasury's annual budget — 10-20% of profits, disbursed by milestones."],
["What is on-chain governance?","Proposals, votes and disbursements all recorded on-chain — public and immutable."],
["What is Realms?","A popular Solana DAO governance framework usable for proposals and voting."],
["How does “committee + community vote” work?","The committee handles daily execution; major matters require community approval."],
["How is fund usage disclosed?","Every disbursement is on-chain, with regular on-chain financial reports and treasury reconciliation."],
["Is the DAO treasury address public?","Yes. Anyone can verify balances and flows on-chain at any time."],
["How do I submit a proposal?","Fill the template (goals, budget, milestones) on the governance platform, then discussion and voting."],
["Is the governance token eCNH itself?","Initially votes are counted in eCNH; a dedicated governance credential may be separated later."],
["How to prevent whale dominance in voting?","Cap per-address voting weight; add long-term locking and contribution weighting."],
["What does each group do?","Tech upgrades, charity disbursement, and community & content operations."],
["How are contributors rewarded?","Tokens or reputation points from the community reward pool, by task completion."],
["How often does the DAO review itself?","Quarterly budget and progress reviews; full plan revision every 2-3 years."],
["Why is liquidity so important?","Without depth, prices are easily manipulated and real users can't get in or out smoothly."],
["How do I earn market-making incentives?","Provide two-sided liquidity to designated pools; earn token rewards by share and duration."],
["One-sided or two-sided LP?","Two-sided LP is healthier, avoiding price distortion from one-sided positions."],
["What is dAMM v2?","Meteora's dynamic AMM model allocating liquidity efficiently within price ranges."],
["What about heavily price-deviated pools?","Pause incentives, announce migration, and guide liquidity to the main pool."],
["Why concentrate on eCNH-USDC?","Fewer pairs mean deeper books, less slippage and truer price discovery."],
["What is the WBTC/eCNH pool for?","It adds Bitcoin as a counter-asset, serving long-term holders' cross-asset allocation."],
["What is impermanent loss?","The opportunity cost of LP positions falling below simply holding, due to price moves."],
["Where can I check the market?","Orb Markets, DEX Screener and wallet-integrated charts."],
["When will centralized exchanges list eCNH?","After depth and compliance mature; the DAO votes on listing priorities."],
["How to reduce dump risk?","Batched unlocks, locked incentives and contributor vesting to lower short-term sell pressure."],
["What holder concentration is healthy?","Top-10 address share gradually falling while holder count keeps rising."],
["How do airdrops decentralize holdings?","Sending tokens directly to many real active addresses dilutes whale share."],
["How do I earn tokens from quests?","Complete content, translation and promotion tasks on official quest platforms."],
["What's the listing process?","Due diligence, compliance review, announcements and liquidity prep — all community-supervised."],
["How are profits allocated?","Tech 20-30%, group operations 10-20%, charity 10-20%, liquidity 5-10%, the rest as reserves."],
["How is the tech budget used?","Contract audits, infrastructure, developer incentives and long-term security."],
["How is the group-operations budget used?","Servers, events, content and localization for overseas groups."],
["Who does charity funding help?","Chinese-language netizens worldwide earning under CNY 1,000/month — living, healthcare, education, elder care."],
["How do I apply for charity aid?","Submit materials via the charity group's public channels; disbursement is anonymous after review."],
["How is charity transparency ensured?","Disbursements on-chain; periodic aggregate disclosure without personal privacy."],
["What does “quiet charity” mean?","Doing good without fanfare — publishing only totals and flows, protecting recipients' dignity."],
["How is the liquidity budget used?","Continuously deepening the eCNH-USDC main pool to reduce volatility and slippage."],
["What happens to remaining profits?","Reserve funds, new-technology R&D and grassroots livelihood infrastructure."],
["How often is the plan refined?","A full revision every 2-3 years, plus rolling updates from community feedback."],
["How does “ordaining conscience for Heaven and Earth” relate to the project?","Giving back through public goods and charity is eCNH's value foundation."],
["How are self-reliance, frugality, reading and kindness embodied?","Encouraging members to support themselves, live simply, learn for life and treat others kindly."],
["Where does “first to worry” come from?","Fan Zhongyan's “Memorial to Yueyang Tower” (Northern Song) — a classical footnote to our charity ethos."],
["Is charity allocation mandatory?","Yes — written into the DAO charter and multisig rules; fund usage must follow the ratios."],
["How is charity abuse prevented?","Multisig payouts, dual-group review, on-chain disclosure and community questioning."],
["How is monthly income verified?","Self-declaration with a signed statement, spot-checked; better to trust the need."],
["In what form is charity paid?","Stablecoins or small token amounts sent directly to recipients' wallets."],
["How are healthcare, education and elder care covered?","Directed disbursement by stated purpose — tuition, medicine and basic living."],
["What does 2027 stand for?","The target year for DAO governance, charity disbursement and the multi-group network to take shape."],
["What is the “2026 DAO POOL”?","The first distributed pool, launched in 2026 — the Meteora dAMM v2 pool."],
["Is eCNH compliant?","Rules differ by jurisdiction — consult local legal opinions; the DAO operates only in compliant regions."],
["Which countries and cities can participate?","Web3-friendly regions first — see the “Friendly Jurisdictions” section."],
["What are the regulatory risks of RMB-related assets?","FX and stablecoin rules are strict; issuance, redemption and promotion need professional legal advice."],
["Why operate only in Web3-compliant regions?","To lower legal risk and protect participants and the DAO's long-term safety."],
["What are the investment risks?","Thin liquidity, high volatility, no peg yet — total loss of principal is possible."],
["Will there be extra issuance?","The goal is public contract authorities with no mint and no freeze, under community oversight."],
["How is hype avoided?","State only verifiable facts, promise no returns, and clearly mark the experimental nature."],
["Is KYC/AML needed?","DEX trading needs no KYC; charity payouts and fiat touchpoints will follow requirements."],
["How are taxes handled?","Tax rules vary by jurisdiction — consult local professionals."],
["Is there a disclaimer?","Yes — see the page footer: nothing here is investment advice."],
["What if reserves can't be verified?","Until 1:1 reserves and redemption exist, the “unpegged” status is stated clearly, never misleading."],
["What are the legal boundaries of community self-governance?","The DAO promises no legal-person status or liability; major matters follow local law."],
["What should I do about scams?","Stop immediately, keep evidence, report to the community and the police if needed."],
["What does “settlement base of the AI economy” mean?","High-frequency agent-to-agent micro-payments need a low-fee, high-throughput settlement layer — Solana provides it."],
["How does eCNH combine with the AI economy?","Exploring AI agents settling data, content and services in eCNH micro-payments."],
["What is RWA?","Real World Assets — tokenizing real assets on-chain; a long-term eCNH exploration direction."],
["What is the cosmic-consciousness philosophy?","Philosophers speculate consciousness may not be human-exclusive — the universe may hold unimaginable minds."],
["Is consciousness exclusive to humans?","Unknown. Humility and curiosity are how this community looks at the stars."],
["How does interstellar civilization relate to eCNH?","At the vision level: if humanity goes interstellar, an open neutral settlement layer could become a civilization's public good."],
["What does “immense wealth” mean?","The long-term growth space opened by Web3+AI+RWA fusion — not short-term speculation."],
["What is the “Global Village”?","A world community interconnected like a village — the very community eCNH serves."],
["How do Web3, AI and RWA fuse?","On-chain property rights (Web3) + intelligent execution (AI) + real assets (RWA), stacked in three layers."],
["What's the three-year plan?","Pool in 2026, governance in 2027, multilingual communities and real settlement in 2028."],
["How can I contribute code or content?","Submit PRs to the GitHub repos or translations via community quest platforms."],
["How do I contact the community?","Via official Telegram, X and other channels listed on the site — beware impostors."]]},

/* ================= engine ================= */
let cur=localStorage.getItem("ecnh_lang")||"zh";
let curT=localStorage.getItem("ecnh_theme")||"apple";
let qaFilter="",qaCat=0;

const QA_RANGE=[[0,20],[20,40],[40,55],[55,75],[75,88],[88,100]]; // per category (exclusive end)
function catOf(i){for(let c=0;c<QA_RANGE.length;c++){if(i>=QA_RANGE[c][0]&&i<QA_RANGE[c][1])return c}return 0}

function render(){
 const L=L10N[cur];document.documentElement.lang=cur;
 document.documentElement.dir=L.dir||"ltr";
 document.documentElement.dataset.theme=curT;
 // nav
 document.getElementById("nav").innerHTML=L.nav.map(([id,t])=>`<a href="#${id}">${t}</a>`).join("");
 // hero
 document.getElementById("hBadge").textContent=L.hero.badge;
 document.getElementById("hTitle").innerHTML=L.hero.title;
 document.getElementById("hSub").textContent=L.hero.sub;
 document.getElementById("copyBtn").textContent=L.hero.ca;
 document.getElementById("hLinks").innerHTML=L.hero.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join("");
 document.getElementById("hStats").innerHTML=L.hero.stats.map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
 // about
 document.getElementById("abTitle").innerHTML=`<span class="n">01</span>${L.about.title}`;
 document.getElementById("abText").textContent=L.about.text;
 document.getElementById("abItems").innerHTML=L.about.items.map(([e,k,v])=>`<div class="card idCard"><div class="em">${e}</div><div><b>${k}</b><p>${v}</p></div></div>`).join("");
 document.getElementById("abNote").textContent=L.about.note;
 // path
 document.getElementById("pTitle").innerHTML=`<span class="n">02</span>${L.path.title}`;
 document.getElementById("pIntro").textContent=L.path.intro;
 document.getElementById("pItems").innerHTML=L.path.items.map(([n,t,d])=>`<div class="card step"><div class="num">${n}</div><div><h3>${t}</h3><p>${d}</p></div></div>`).join("");
 // jurisdictions
 document.getElementById("jTitle").innerHTML=`<span class="n">03</span>${L.jur.title}`;
 document.getElementById("jIntro").textContent=L.jur.intro;
 document.getElementById("jGroups").innerHTML=L.jur.groups.map(([g,ps])=>`<div class="card jGroup"><h3>${g}</h3><div class="chips">${ps.map(p=>`<span class="chip">${p}</span>`).join("")}</div></div>`).join("");
 document.getElementById("jNote").textContent=L.jur.note;
 // vision
 document.getElementById("vTitle").innerHTML=`<span class="n">04</span>${L.vision.title}`;
 let vb=L.vision.paras.map(p=>`<p>${p}</p>`).join("");
 vb+=L.vision.quotes.map(([q,b])=>`<div class="quote">${q}<small>${b}</small></div>`).join("");
 vb+=`<div class="values">${L.vision.values.map(v=>`<span>${v}</span>`).join("")}</div>`;
 document.getElementById("vBody").innerHTML=vb;
 // charity
 document.getElementById("cTitle").innerHTML=`<span class="n">05</span>${L.charity.title}`;
 document.getElementById("cIntro").textContent=L.charity.intro;
 document.getElementById("cAlloc").innerHTML=L.charity.alloc.map(([p,t,w,d])=>`<div class="row"><div class="top"><span><b>${p}</b> · ${t}</span></div><div class="bar"><div class="fill" style="width:${w}%"></div></div><p class="desc">${d}</p></div>`).join("");
 document.getElementById("cNote").textContent=L.charity.note;
 // roadmap
 document.getElementById("rTitle").innerHTML=`<span class="n">06</span>${L.roadmap.title}`;
 document.getElementById("rItems").innerHTML=L.roadmap.items.map(([t,d])=>`<div class="node"><b>${t}</b><p>${d}</p></div>`).join("");
 // qa
 document.getElementById("qTitle").innerHTML=`<span class="n">07</span>${L.qa.title}`;
 document.getElementById("qLead").textContent=L.qa.lead;
 document.getElementById("qSearch").placeholder=L.qa.search;
 document.getElementById("qCat").innerHTML=L.qa.cats.map((c,i)=>`<option value="${i}">${c}</option>`).join("");
 document.getElementById("qCat").value=qaCat;
 renderQA();
 // footer
 document.getElementById("fDisc").textContent=L.footer.disc;
 document.getElementById("fLinks").innerHTML=L.footer.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join("");
 document.getElementById("fRights").textContent=L.footer.rights;
 // controls
 document.getElementById("langSel").innerHTML=Object.keys(L10N).map(k=>`<option value="${k}">${L10N[k].name}</option>`).join("");
 document.getElementById("langSel").value=cur;
 document.querySelectorAll(".themeBtns button").forEach(b=>b.classList.toggle("on",b.dataset.t===curT));
}
function renderQA(){
 const L=L10N[cur];const kw=qaFilter.trim().toLowerCase();
 const idxs=L.qa.items.map((it,i)=>i).filter(i=>{
  if(qaCat>0&&catOf(i)!==qaCat-1)return false;
  if(!kw)return true;
  return L.qa.items[i][0].toLowerCase().includes(kw)||L.qa.items[i][1].toLowerCase().includes(kw);
 });
 document.getElementById("qCount").textContent=L.qa.count.replace("{n}",idxs.length);
 document.getElementById("qList").innerHTML=idxs.map(i=>`<details class="qaItem"><summary>${L.qa.items[i][0]}</summary><div class="ans">${L.qa.items[i][1]}</div></details>`).join("")||`<p style="color:var(--muted)">${L.qa.empty}</p>`;
}
document.getElementById("copyBtn").onclick=e=>{
 navigator.clipboard.writeText(CA).then(()=>{e.target.textContent=L10N[cur].hero.copied;setTimeout(()=>e.target.textContent=L10N[cur].hero.ca,1600)});
};
document.getElementById("langSel").onchange=e=>{cur=e.target.value;localStorage.setItem("ecnh_lang",cur);render()};
document.querySelectorAll(".themeBtns button").forEach(b=>b.onclick=()=>{curT=b.dataset.t;localStorage.setItem("ecnh_theme",curT);render()});
document.getElementById("qSearch").oninput=e=>{qaFilter=e.target.value;renderQA()};
document.getElementById("qCat").onchange=e=>{qaCat=+e.target.value;renderQA()};
window.addEventListener("scroll",()=>{document.getElementById("top").style.display=scrollY>500?"block":"none"});
render();
</script>
</body>
</html>
